[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mrc2movie"
version = "0.2.0"
description = "Convert MRC tomograms with IMOD particle annotations to video"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mrcfile>=1.5.4",
    "numpy>=1.24.0",
    "opencv-python>=4.11.0",
    "tqdm>=4.67.0",
]

[project.scripts]
mrc2movie = "mrc2movie:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mrc2movie.py"]
